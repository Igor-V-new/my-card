<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">

  <title>Игорь — контакты</title>

  <style>
    /* Фирменные цвета и светлая тема */
    :root {
      color-scheme: light;

      --limeade: #30AD00;
      --mine-shaft: #262626;
      --quarter-white: #F6F2DE;

      --page-background: #F6F2DE;
      --card-background: rgba(246, 242, 222, 0.95);
      --text: #262626;
      --muted: #555545;
      --border: rgba(38, 38, 38, 0.2);
      --surface: rgba(38, 38, 38, 0.06);

      --map-opacity: 0.36;
      --background-overlay:
        linear-gradient(
          135deg,
          rgba(48, 173, 0, 0.26) 0%,
          rgba(246, 242, 222, 0.68) 48%,
          rgba(38, 38, 38, 0.34) 100%
        );

      --shadow: 0 24px 70px rgba(38, 38, 38, 0.2);
    }

    /* Тёмная тема */
    :root[data-theme="dark"] {
      color-scheme: dark;

      --page-background: #262626;
      --card-background: rgba(38, 38, 38, 0.95);
      --text: #F6F2DE;
      --muted: #ccc9b8;
      --border: rgba(246, 242, 222, 0.22);
      --surface: rgba(246, 242, 222, 0.07);

      --map-opacity: 0.22;
      --background-overlay:
        linear-gradient(
          135deg,
          rgba(48, 173, 0, 0.25) 0%,
          rgba(38, 38, 38, 0.65) 52%,
          rgba(38, 38, 38, 0.9) 100%
        );

      --shadow: 0 24px 70px rgba(0, 0, 0, 0.4);
    }

    * {
      box-sizing: border-box;
    }

    [hidden] {
      display: none !important;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      padding: 32px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;

      font-family: Arial, sans-serif;
      color: var(--text);
      background: var(--page-background);
      isolation: isolate;
    }

    /* Неподвижный фон */
    .background {
      position: fixed;
      inset: 0;
      z-index: -1;
      overflow: hidden;
      pointer-events: none;
      background: var(--page-background);
    }

    .background-map {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      opacity: var(--map-opacity);
      filter: grayscale(65%) blur(2px);
      transform: scale(1.03);
    }

    .background::after {
      content: "";
      position: absolute;
      inset: 0;
      background: var(--background-overlay);
    }

    .card {
      width: 100%;
      max-width: 460px;
      margin-top: auto;
      padding: 28px;
      border: 1px solid var(--border);
      border-top: 5px solid var(--limeade);
      border-radius: 26px;
      background: var(--card-background);
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      text-align: center;
    }

    .toolbar {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 22px;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    button {
      font: inherit;
      cursor: pointer;
    }

    .theme-button {
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      background: var(--surface);
      font-size: 14px;
    }

    .avatar,
    .avatar-placeholder {
      width: 152px;
      height: 152px;
      margin: 0 auto 20px;
      border: 4px solid var(--limeade);
      border-radius: 50%;
    }

    .avatar {
      display: block;
      object-fit: cover;
      object-position: center;
    }

    .avatar-placeholder {
      display: grid;
      place-items: center;
      background: var(--surface);
      font-size: 60px;
    }

    h1 {
      margin: 0;
      font-size: 34px;
      line-height: 1.2;
      overflow-wrap: anywhere;
    }

    .accent-line {
      width: 48px;
      height: 4px;
      margin: 18px auto 24px;
      border-radius: 10px;
      background: var(--limeade);
    }

    .actions {
      display: grid;
      gap: 12px;
    }

    .button {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      min-height: 50px;
      padding: 14px 16px;

      border: 1px solid var(--border);
      border-radius: 14px;

      background: var(--surface);
      color: var(--text);

      font: inherit;
      font-weight: bold;
      line-height: 1.4;
      text-align: center;
      text-decoration: none;
      overflow-wrap: anywhere;

      transition:
        transform 0.15s ease,
        background-color 0.15s ease;
    }

    .button-primary {
      border-color: var(--limeade);
      background: var(--limeade);
      color: var(--mine-shaft);
    }

    @media (hover: hover) {
      .button:hover {
        transform: translateY(-2px);
        background: var(--border);
      }

      .button-primary:hover {
        background: #3bc20a;
      }

      .theme-button:hover {
        background: var(--border);
      }
    }

    a:focus-visible,
    button:focus-visible {
      outline: 3px solid var(--limeade);
      outline-offset: 4px;
    }

    .qr-section {
      margin-top: 26px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
    }

    h2 {
      margin: 0 0 16px;
      font-size: 20px;
    }

    .qr-link {
      display: inline-block;
      max-width: 100%;
      padding: 12px;
      border-radius: 16px;
      background: #ffffff;
    }

    .qr-image {
      display: block;
      width: 184px;
      max-width: 100%;
      height: auto;
    }

    .telegram-name {
      margin: 12px 0 0;
      font-weight: bold;
    }

    .hint {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .map-credit {
      margin: 0 0 auto;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--card-background);
      color: var(--text);
      font-size: 12px;
      text-align: center;
    }

    .map-credit a {
      color: inherit;
      text-underline-offset: 3px;
    }

    @media (max-width: 380px) {
      body {
        padding: 16px 12px;
      }

      .card {
        padding: 22px 18px;
      }

      h1 {
        font-size: 29px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .button {
        transition: none;
      }
    }
  </style>
</head>

<body>
  <div class="background" aria-hidden="true">
    <img
      id="background-map"
      class="background-map"
      alt=""
    >
  </div>

  <main class="card">
    <div class="toolbar">
      <button
        id="theme-button"
        class="theme-button"
        type="button"
        aria-label="Тёмная тема"
        aria-pressed="false"
      >
        🌙 Тёмная тема
      </button>
    </div>

    <img id="photo" class="avatar" alt="">

    <div
      id="photo-placeholder"
      class="avatar-placeholder"
      aria-hidden="true"
      hidden
    >
      👤
    </div>

    <h1 id="name">Игорь</h1>

    <div class="accent-line" aria-hidden="true"></div>

    <div class="actions">
      <a
        id="telegram-link"
        class="button button-primary"
        target="_blank"
        rel="noopener noreferrer"
      >
        Написать в Telegram
      </a>

      <a id="phone-link" class="button"></a>

      <a id="email-link" class="button"></a>

      <button
        id="save-contact"
        class="button"
        type="button"
      >
        Сохранить контакт
      </button>
    </div>

    <section class="qr-section" aria-labelledby="qr-title">
      <h2 id="qr-title">Будем на связи</h2>

      <a
        id="qr-link"
        class="qr-link"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Открыть Telegram"
      >
        <img
          id="qr-image"
          class="qr-image"
          width="184"
          height="184"
          alt="QR-код для перехода в Telegram"
        >
      </a>

      <p id="telegram-name" class="telegram-name"></p>

      <p id="qr-error" class="hint" hidden>
        QR-код не загрузился. Используй кнопку Telegram выше.
      </p>

      <p class="hint">
        Отсканируй QR-код камерой телефона
        или нажми на него.
      </p>

      <p class="hint">
        «Сохранить контакт» скачает карточку с номером и почтой.
        Открой файл и подтверди добавление в контакты.
      </p>
    </section>

    <noscript>
      <p>Для работы кнопок и загрузки данных включи JavaScript.</p>
    </noscript>
  </main>

  <footer id="map-credit" class="map-credit" hidden>
    Карта Москвы:
    <a
      href="https://2gis.ru/moscow"
      target="_blank"
      rel="noopener noreferrer"
    >2ГИС</a>
  </footer>

  <script>
    // ========================================
    // ТВОИ ДАННЫЕ
    // Перенеси номер и почту из прежнего файла.
    // ========================================

    const PROFILE = {
      name: "Игорь",
      phone: "ВСТАВЬ_СВОЙ_НОМЕР",
      email: "ВСТАВЬ_СВОЮ_ПОЧТУ",
      telegram: "Igor_V25",
      photo: "photo.jpg",
      map: "moscow-map.jpg"
    };

    // ========================================
    // ДАННЫЕ НА СТРАНИЦЕ
    // ========================================

    const telegramUsername = PROFILE.telegram.trim().replace(/^@/, "");
    const telegramUrl = "https://t.me/" + telegramUsername;
    const phoneForCall = PROFILE.phone.replace(/[^\d+]/g, "");

    document.title = PROFILE.name + " — контакты";
    document.getElementById("name").textContent = PROFILE.name;

    const phoneLink = document.getElementById("phone-link");
    phoneLink.textContent = PROFILE.phone;
    phoneLink.href = "tel:" + phoneForCall;

    const emailLink = document.getElementById("email-link");
    emailLink.textContent = PROFILE.email;
    emailLink.href = "mailto:" + PROFILE.email.trim();

    document.getElementById("telegram-link").href = telegramUrl;

    document.getElementById("telegram-name").textContent =
      "@" + telegramUsername;

    const qrLink = document.getElementById("qr-link");
    qrLink.href = telegramUrl;

    // ========================================
    // ФОТОГРАФИЯ
    // ========================================

    const photo = document.getElementById("photo");
    photo.alt = "Фото: " + PROFILE.name;

    photo.addEventListener("error", () => {
      photo.hidden = true;
      document.getElementById("photo-placeholder").hidden = false;
    });

    photo.src = PROFILE.photo;

    // ========================================
    // КАРТА НА ФОНЕ
    // ========================================

    const mapImage = document.getElementById("background-map");
    const mapCredit = document.getElementById("map-credit");

    mapImage.addEventListener("load", () => {
      mapCredit.hidden = false;
    });

    mapImage.addEventListener("error", () => {
      mapImage.hidden = true;
      mapCredit.hidden = true;
    });

    mapImage.src = PROFILE.map;

    // ========================================
    // QR-КОД TELEGRAM
    // ========================================

    const qrImage = document.getElementById("qr-image");

    qrImage.addEventListener("error", () => {
      qrLink.hidden = true;
      document.getElementById("qr-error").hidden = false;
    });

    // Внешнему сервису передаётся ссылка Telegram,
    // но не номер телефона и не почта.
    qrImage.referrerPolicy = "no-referrer";
    qrImage.src =
      "https://api.qrserver.com/v1/create-qr-code/" +
      "?size=240x240&margin=12&data=" +
      encodeURIComponent(telegramUrl);

    // ========================================
    // СВЕТЛАЯ И ТЁМНАЯ ТЕМА
    // ========================================

    const themeButton = document.getElementById("theme-button");

    const systemTheme = window.matchMedia(
      "(prefers-color-scheme: dark)"
    );

    let savedTheme = null;

    try {
      savedTheme = localStorage.getItem("card-theme");
    } catch (error) {
      // Если сохранение запрещено, используем системную тему.
    }

    const initialTheme =
      savedTheme === "dark" || savedTheme === "light"
        ? savedTheme
        : (systemTheme.matches ? "dark" : "light");

    function applyTheme(theme) {
      const isDark = theme === "dark";

      document.documentElement.dataset.theme = theme;

      themeButton.textContent = isDark
        ? "☀️ Светлая тема"
        : "🌙 Тёмная тема";

      themeButton.setAttribute("aria-pressed", String(isDark));
    }

    applyTheme(initialTheme);

    themeButton.addEventListener("click", () => {
      const newTheme =
        document.documentElement.dataset.theme === "dark"
          ? "light"
          : "dark";

      applyTheme(newTheme);

      try {
        localStorage.setItem("card-theme", newTheme);
      } catch (error) {
        // Тема продолжит работать без сохранения настройки.
      }
    });

    // ========================================
    // СОХРАНЕНИЕ КОНТАКТА
    // ========================================

    function escapeVCard(value) {
      return String(value)
        .replace(/\\/g, "\\\\")
        .replace(/\r\n|\r|\n/g, "\\n")
        .replace(/;/g, "\\;")
        .replace(/,/g, "\\,");
    }

    document.getElementById("save-contact").addEventListener("click", () => {
      const vcard = [
        "BEGIN:VCARD",
        "VERSION:3.0",
        "N:;" + escapeVCard(PROFILE.name) + ";;;",
        "FN:" + escapeVCard(PROFILE.name),
        "TEL;TYPE=CELL:" + phoneForCall,
        "EMAIL;TYPE=INTERNET:" + escapeVCard(PROFILE.email.trim()),
        "URL:" + telegramUrl,
        "NOTE:" + escapeVCard("Telegram: @" + telegramUsername),
        "END:VCARD",
        ""
      ].join("\r\n");

      const file = new Blob([vcard], {
        type: "text/vcard;charset=utf-8"
      });

      const fileUrl = URL.createObjectURL(file);
      const link = document.createElement("a");

      link.href = fileUrl;
      link.download = "igor-contact.vcf";

      document.body.appendChild(link);
      link.click();
      link.remove();

      setTimeout(() => {
        URL.revokeObjectURL(fileUrl);
      }, 60000);
    });
  </script>
</body>
</html>
